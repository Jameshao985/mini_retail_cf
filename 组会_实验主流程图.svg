<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320" role="img" aria-labelledby="title desc">
  <title id="title">失败诊断驱动的最小反事实数据合成实验主流程</title>
  <desc id="desc">从一个Qwen3-0.6B底座模型出发，经共同协议预热、失败发现与层次聚类，分成普通、定向普通、普通反事实、定向反事实四个训练组，等量LoRA训练后在固定测试集上比较。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #F8FAFC; }
      .title { font: 700 42px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #0F172A; }
      .subtitle { font: 400 20px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #475569; }
      .stage { font: 700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #2563EB; letter-spacing: 1px; }
      .node-title { font: 700 23px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #0F172A; }
      .node-text { font: 400 17px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #334155; }
      .small { font: 400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #475569; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #64748B; }
      .metric { font: 700 17px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #1E3A8A; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-blue { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2.5; rx: 18; }
      .box-orange { fill: #FFF7ED; stroke: #FB923C; stroke-width: 2.5; rx: 18; }
      .box-purple { fill: #FAF5FF; stroke: #C084FC; stroke-width: 2.5; rx: 18; }
      .box-green { fill: #F0FDF4; stroke: #4ADE80; stroke-width: 2.5; rx: 18; }
      .box-slate { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 2; rx: 16; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563EB; stroke-width: 3.5; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 8 8; }
      .divider { stroke: #CBD5E1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1320"/>
  <text x="70" y="70" class="title">失败诊断驱动的最小反事实数据合成：四组对照实验主流程</text>
  <text x="70" y="108" class="subtitle">一个底座模型，共享同一起点；两个实验因素：是否按弱点定向 × 是否使用最小反事实任务对</text>

  <text x="70" y="155" class="stage">阶段 1｜建立完全相同的实验起点</text>
  <rect x="70" y="178" width="350" height="132" class="box"/>
  <text x="245" y="220" text-anchor="middle" class="node-title">Qwen3-0.6B 底座</text>
  <text x="245" y="255" text-anchor="middle" class="node-text">只有一个基础权重</text>
  <text x="245" y="284" text-anchor="middle" class="small">此时不会复制四个不同模型</text>

  <path d="M420 244 H500" class="arrow"/>
  <rect x="500" y="178" width="410" height="132" class="box-blue"/>
  <text x="705" y="218" text-anchor="middle" class="node-title">共同协议预热</text>
  <text x="705" y="251" text-anchor="middle" class="node-text">先学习 JSON、查状态、调用工具</text>
  <text x="705" y="280" text-anchor="middle" class="small">目的：排除“连基本操作都不会”的干扰</text>

  <path d="M910 244 H990" class="arrow"/>
  <rect x="990" y="178" width="390" height="132" class="box-green"/>
  <text x="1185" y="218" text-anchor="middle" class="node-title">共享预热 LoRA 起点</text>
  <text x="1185" y="251" text-anchor="middle" class="node-text">四组都从这一份适配器继续训练</text>
  <text x="1185" y="280" text-anchor="middle" class="small">保证比较时的基础能力完全一致</text>

  <rect x="1450" y="162" width="400" height="164" class="box-slate"/>
  <text x="1650" y="200" text-anchor="middle" class="node-title">可复现重复实验</text>
  <text x="1480" y="236" class="node-text">训练随机种子：42 / 43 / 44</text>
  <text x="1480" y="265" class="small">重复整条流水线，得到三次独立训练结果</text>
  <text x="1480" y="294" class="small">测试题种子固定：20260914（同一张试卷）</text>

  <text x="70" y="365" class="stage">阶段 2｜从真实执行失败中形成弱点证据</text>
  <rect x="70" y="390" width="245" height="145" class="box"/>
  <text x="192" y="430" text-anchor="middle" class="node-title">发现集执行</text>
  <text x="192" y="465" text-anchor="middle" class="node-text">预热后的 Student</text>
  <text x="192" y="493" text-anchor="middle" class="node-text">逐题调用工具</text>
  <text x="192" y="516" text-anchor="middle" class="tiny">保存每一步原始轨迹</text>

  <path d="M315 462 H365" class="arrow"/>
  <rect x="365" y="390" width="265" height="145" class="box"/>
  <text x="497" y="430" text-anchor="middle" class="node-title">程序验证器</text>
  <text x="497" y="465" text-anchor="middle" class="node-text">检查动作、参数、状态</text>
  <text x="497" y="493" text-anchor="middle" class="node-text">回复与违规尝试</text>
  <text x="497" y="516" text-anchor="middle" class="tiny">不是让另一个 LLM 打分</text>

  <path d="M630 462 H680" class="arrow"/>
  <rect x="680" y="390" width="330" height="145" class="box"/>
  <text x="845" y="430" text-anchor="middle" class="node-title">失败表示</text>
  <text x="845" y="464" text-anchor="middle" class="node-text">阶段 + 可见状态 + 错误类型</text>
  <text x="845" y="492" text-anchor="middle" class="node-text">期望动作 + 实际动作</text>
  <text x="845" y="516" text-anchor="middle" class="tiny">去掉订单号、价格、商品等无关信息</text>

  <path d="M1010 462 H1060" class="arrow"/>
  <rect x="1060" y="390" width="365" height="145" class="box-purple"/>
  <text x="1242" y="426" text-anchor="middle" class="node-title">层次聚类</text>
  <text x="1242" y="459" text-anchor="middle" class="node-text">Qwen 均值池化语义向量</text>
  <text x="1242" y="487" text-anchor="middle" class="node-text">+ 错误结构 one-hot（权重 2）</text>
  <text x="1242" y="515" text-anchor="middle" class="tiny">凝聚式；余弦距离；平均链接；阈值 0.25</text>

  <path d="M1425 462 H1475" class="arrow"/>
  <rect x="1475" y="390" width="375" height="145" class="box-orange"/>
  <text x="1662" y="430" text-anchor="middle" class="node-title">弱点预算分配</text>
  <text x="1662" y="465" text-anchor="middle" class="node-text">主要依据：每类任务错误率</text>
  <text x="1662" y="493" text-anchor="middle" class="node-text">少量错误模式多样性奖励</text>
  <text x="1662" y="516" text-anchor="middle" class="tiny">保留 10% 均匀探索，避免遗漏能力</text>

  <path d="M1185 310 V350 H192 V390" class="dash"/>
  <text x="720" y="348" class="tiny">同一个共享预热 Student 用于发现失败</text>

  <text x="70" y="590" class="stage">阶段 3｜构造 2×2 四组训练数据（任务总量、教师、更新数保持一致）</text>

  <rect x="70" y="620" width="410" height="205" class="box"/>
  <text x="275" y="662" text-anchor="middle" class="node-title">普通合成 random</text>
  <line x1="100" y1="680" x2="450" y2="680" class="divider"/>
  <text x="105" y="718" class="node-text">预算：五类任务平均分配</text>
  <text x="105" y="751" class="node-text">结构：每道题相互独立</text>
  <text x="105" y="790" class="small">回答：普通随机训练能提升多少？</text>

  <rect x="525" y="620" width="410" height="205" class="box-orange"/>
  <text x="730" y="662" text-anchor="middle" class="node-title">定向普通 targeted</text>
  <line x1="555" y1="680" x2="905" y2="680" class="divider"/>
  <text x="560" y="718" class="node-text">预算：弱项多出题，强项少出题</text>
  <text x="560" y="751" class="node-text">结构：每道题仍然相互独立</text>
  <text x="560" y="790" class="small">隔离“根据失败定向”的贡献</text>

  <rect x="980" y="620" width="410" height="205" class="box-blue"/>
  <text x="1185" y="662" text-anchor="middle" class="node-title">普通反事实 random_cf</text>
  <line x1="1010" y1="680" x2="1360" y2="680" class="divider"/>
  <text x="1015" y="718" class="node-text">预算：五类任务平均分配</text>
  <text x="1015" y="751" class="node-text">结构：两题成对，只改一个关键条件</text>
  <text x="1015" y="785" class="small">例：收货 7 天 → 可退；8 天 → 拒绝</text>
  <text x="1015" y="808" class="tiny">不根据当前 Student 的弱点调整题量</text>

  <rect x="1435" y="620" width="415" height="205" class="box-green"/>
  <text x="1642" y="662" text-anchor="middle" class="node-title">定向反事实 targeted_cf</text>
  <line x1="1465" y1="680" x2="1820" y2="680" class="divider"/>
  <text x="1470" y="718" class="node-text">预算：弱项多出题，强项少出题</text>
  <text x="1470" y="751" class="node-text">结构：两题成对，只改一个关键条件</text>
  <text x="1470" y="785" class="small">同时包含“定向”与“反事实”</text>
  <text x="1470" y="808" class="tiny">论文主方法</text>

  <path d="M1662 535 V575 H730 V620" class="arrow"/>
  <path d="M1662 575 H1642 V620" class="arrow"/>
  <path d="M1480 575 H275 V620" class="arrow"/>
  <path d="M1185 575 V620" class="arrow"/>

  <text x="70" y="875" class="stage">阶段 4｜公平训练与独立评测</text>
  <rect x="160" y="900" width="630" height="155" class="box-blue"/>
  <text x="475" y="942" text-anchor="middle" class="node-title">等量 LoRA 训练</text>
  <text x="475" y="978" text-anchor="middle" class="node-text">四组分别从同一份共享预热适配器继续训练</text>
  <text x="475" y="1008" text-anchor="middle" class="node-text">得到四个独立 LoRA；主任务数、更新数、教师相同</text>
  <text x="475" y="1035" text-anchor="middle" class="tiny">差异只来自：预算是否定向、训练题是否成对</text>

  <path d="M790 978 H880" class="arrow-blue"/>
  <rect x="880" y="900" width="880" height="155" class="box-green"/>
  <text x="1320" y="940" text-anchor="middle" class="node-title">固定留出集评测（训练过程不可见）</text>
  <text x="1320" y="975" text-anchor="middle" class="metric">Test　｜　OOD 新措辞　｜　Invariance 无关变量　｜　Composition 多条件组合</text>
  <text x="1320" y="1008" text-anchor="middle" class="node-text">完整成功率 · 反事实两侧均正确率 · 违规尝试率 · 过度拒绝率</text>
  <text x="1320" y="1035" text-anchor="middle" class="tiny">42、43、44 三次使用同一张测试卷，汇总均值、标准差与方法差值</text>

  <path d="M275 825 V862 H475 V900" class="dash"/>
  <path d="M730 825 V862 H475 V900" class="dash"/>
  <path d="M1185 825 V862 H475 V900" class="dash"/>
  <path d="M1642 825 V862 H475 V900" class="dash"/>

  <text x="70" y="1110" class="stage">阶段 5｜用预先规定的差值回答研究问题</text>
  <rect x="70" y="1135" width="560" height="120" class="box-slate"/>
  <text x="350" y="1178" text-anchor="middle" class="node-title">targeted − random</text>
  <text x="350" y="1215" text-anchor="middle" class="node-text">隔离“根据失败定向出题”的收益</text>

  <rect x="680" y="1135" width="560" height="120" class="box-slate"/>
  <text x="960" y="1178" text-anchor="middle" class="node-title">random_cf − random</text>
  <text x="960" y="1215" text-anchor="middle" class="node-text">隔离“使用最小反事实对”的收益</text>

  <rect x="1290" y="1135" width="560" height="120" class="box-blue"/>
  <text x="1570" y="1178" text-anchor="middle" class="node-title">targeted_cf − targeted</text>
  <text x="1570" y="1215" text-anchor="middle" class="node-text">主比较：相同弱点预算下，反事实是否有额外收益</text>

  <text x="960" y="1292" text-anchor="middle" class="tiny">结论边界：聚类是可观察错误聚合，不等于开放式能力发现；只有跨 seed 稳定差值才能支持方法有效性。</text>
</svg>
